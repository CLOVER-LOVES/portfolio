<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#77A664;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4C281;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Main background -->
  <rect width="800" height="400" fill="url(#bg-gradient)" />
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#77A664" stroke-width="1" opacity="0.2" />
  <circle cx="700" cy="300" r="100" fill="none" stroke="#D4C281" stroke-width="1" opacity="0.2" />
  <circle cx="400" cy="200" r="150" fill="none" stroke="#A3AB9A" stroke-width="1" opacity="0.1" />
  
  <!-- Browser window -->
  <rect x="150" y="50" width="500" height="300" rx="10" ry="10" fill="#2a2a2a" stroke="#333" stroke-width="2" />
  
  <!-- Browser header -->
  <rect x="150" y="50" width="500" height="40" rx="10" ry="10" fill="#333" />
  <circle cx="180" cy="70" r="8" fill="#ff5f57" />
  <circle cx="205" cy="70" r="8" fill="#ffbd2e" />
  <circle cx="230" cy="70" r="8" fill="#28ca41" />
  
  <!-- URL bar -->
  <rect x="250" y="60" width="350" height="20" rx="5" ry="5" fill="#444" />
  <text x="425" y="75" font-family="Arial" font-size="12" text-anchor="middle" fill="#aaa">anshumaanrajpurohit.com</text>
  
  <!-- Website content -->
  <rect x="150" y="90" width="500" height="260" fill="#222" />
  
  <!-- Navigation bar -->
  <rect x="150" y="90" width="500" height="50" fill="#333" />
  <rect x="200" y="115" width="50" height="3" rx="1.5" ry="1.5" fill="url(#accent-gradient)" />
  <rect x="280" y="115" width="50" height="3" rx="1.5" ry="1.5" fill="#aaa" />
  <rect x="360" y="115" width="50" height="3" rx="1.5" ry="1.5" fill="#aaa" />
  <rect x="440" y="115" width="50" height="3" rx="1.5" ry="1.5" fill="#aaa" />
  <rect x="520" y="115" width="50" height="3" rx="1.5" ry="1.5" fill="#aaa" />
  
  <!-- Hero section -->
  <rect x="170" y="160" width="220" height="170" fill="#333" opacity="0.5" rx="5" ry="5" />
  
  <!-- Hero text -->
  <rect x="190" y="180" width="180" height="15" rx="2" ry="2" fill="#77A664" opacity="0.8" />
  <rect x="190" y="205" width="150" height="8" rx="2" ry="2" fill="#aaa" opacity="0.6" />
  <rect x="190" y="220" width="180" height="8" rx="2" ry="2" fill="#aaa" opacity="0.6" />
  <rect x="190" y="235" width="160" height="8" rx="2" ry="2" fill="#aaa" opacity="0.6" />
  
  <!-- CTA buttons -->
  <rect x="190" y="265" width="80" height="30" rx="15" ry="15" fill="#77A664" />
  <rect x="280" y="265" width="80" height="30" rx="15" ry="15" fill="none" stroke="#D4C281" stroke-width="2" />
  
  <!-- Profile image -->
  <circle cx="500" cy="200" r="70" fill="#444" />
  <circle cx="500" cy="200" r="68" fill="#333" />
  <circle cx="500" cy="200" r="65" fill="#FFD700" />
  <circle cx="500" cy="200" r="65" fill="none" stroke="#77A664" stroke-width="2" />
  
  <!-- Animated elements -->
  <g filter="url(#glow)">
    <circle cx="430" cy="140" r="5" fill="#77A664" opacity="0.7">
      <animate attributeName="cy" values="140;150;140" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="570" cy="140" r="5" fill="#D4C281" opacity="0.7">
      <animate attributeName="cy" values="140;130;140" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="280" r="5" fill="#A3AB9A" opacity="0.7">
      <animate attributeName="cy" values="280;290;280" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Parallax effect lines -->
  <line x1="150" y1="150" x2="650" y2="150" stroke="#444" stroke-width="1" opacity="0.3" />
  <line x1="150" y1="250" x2="650" y2="250" stroke="#444" stroke-width="1" opacity="0.3" />
  
  <!-- Title -->
  <text x="400" y="380" font-family="Arial" font-size="24" text-anchor="middle" fill="#FBFBFB">Modern Portfolio Website</text>
</svg>
