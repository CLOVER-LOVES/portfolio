  <circle cx="280" cy="210" r="10" fill="#77A664" opacity="0.6"/>
  
  <!-- Neural Network -->
  <circle cx="450" cy="100" r="12" fill="#D4C281" opacity="0.8"/>
  <circle cx="450" cy="140" r="12" fill="#D4C281" opacity="0.8"/>
  <circle cx="450" cy="180" r="12" fill="#D4C281" opacity="0.8"/>
  <circle cx="450" cy="220" r="12" fill="#D4C281" opacity="0.8"/>
  
  <circle cx="550" cy="120" r="12" fill="#A3AB9A" opacity="0.8"/>
  <circle cx="550" cy="160" r="12" fill="#A3AB9A" opacity="0.8"/>
  <circle cx="550" cy="200" r="12" fill="#A3AB9A" opacity="0.8"/>
  
  <circle cx="650" cy="140" r="12" fill="#77A664" opacity="0.8"/>
  <circle cx="650" cy="180" r="12" fill="#77A664" opacity="0.8"/>
  
  <!-- Neural Network Connections -->
  <line x1="450" y1="100" x2="550" y2="120" stroke="#FBFBFB" stroke-width="1" opacity="0.3"/>
  <line x1="450" y1="100" x2="550" y2="160" stroke="#FBFBFB" stroke-width="1" opacity="0.3"/>
  <line x1="450" y1="100" x2="550" y2="200" stroke="#FBFBFB" stroke-width="1" opacity="0.3"/>
  
  <line x1="450" y1="140" x2="550" y2="120" stroke="#FBFBFB" stroke-width="1" opacity="0.3"/>
  <line x1="450" y1="140" x2="550" y2="160" stroke="#FBFBFB" stroke-width="1" opacity="0.3"/>
  <line x1="450" y1="140" x2="550" y2="200" stroke="#FBFBFB" stroke-width="1" opacity="0.3"/>
  
  <line x1="450" y1="180" x2="550" y2="120" stroke="#FBFBFB" stroke-width="1" opacity="0.3"/>
  <line x1="450" y1="180" x2="550" y2="160" stroke="#FBFBFB" stroke-width="1" opacity="0.3"/>
  <line x1="450" y1="180" x2="550" y2="200" stroke="#FBFBFB" stroke-width="1" opacity="0.3"/>
  
  <line x1="450" y1="220" x2="550" y2="120" stroke="#FBFBFB" stroke-width="1" opacity="0.3"/>
  <line x1="450" y1="220" x2="550" y2="160" stroke="#FBFBFB" stroke-width="1" opacity="0.3"/>
  <line x1="450" y1="220" x2="550" y2="200" stroke="#FBFBFB" stroke-width="1" opacity="0.3"/>
  
  <line x1="550" y1="120" x2="650" y2="140" stroke="#FBFBFB" stroke-width="1" opacity="0.3"/>
  <line x1="550" y1="120" x2="650" y2="180" stroke="#FBFBFB" stroke-width="1" opacity="0.3"/>
  
  <line x1="550" y1="160" x2="650" y2="140" stroke="#FBFBFB" stroke-width="1" opacity="0.3"/>
  <line x1="550" y1="160" x2="650" y2="180" stroke="#FBFBFB" stroke-width="1" opacity="0.3"/>
  
  <line x1="550" y1="200" x2="650" y2="140" stroke="#FBFBFB" stroke-width="1" opacity="0.3"/>
  <line x1="550" y1="200" x2="650" y2="180" stroke="#FBFBFB" stroke-width="1" opacity="0.3"/>
  
  <!-- Regression Line -->
  <line x1="100" y1="280" x2="300" y2="280" stroke="#FBFBFB" stroke-width="2"/>
  <line x1="100" y1="280" x2="100" y2="240" stroke="#FBFBFB" stroke-width="2"/>
  
  <circle cx="130" cy="270" r="4" fill="#D4C281"/>
  <circle cx="160" cy="260" r="4" fill="#D4C281"/>
  <circle cx="190" cy="250" r="4" fill="#D4C281"/>
  <circle cx="220" cy="265" r="4" fill="#D4C281"/>
  <circle cx="250" cy="245" r="4" fill="#D4C281"/>
  <circle cx="280" cy="255" r="4" fill="#D4C281"/>
  
  <line x1="130" y1="270" x2="280" y2="255" stroke="#77A664" stroke-width="2"/>
  
  <!-- Code Snippet -->
  <rect x="350" y="240" width="400" height="100" rx="5" ry="5" fill="#333333"/>
  <text x="370" y="265" font-family="monospace" font-size="12" fill="#A3AB9A">def train_model(X, y):</text>
  <text x="390" y="285" font-family="monospace" font-size="12" fill="#D4C281">    model = Algorithm()</text>
  <text x="390" y="305" font-family="monospace" font-size="12" fill="#D4C281">    model.fit(X, y)</text>
  <text x="390" y="325" font-family="monospace" font-size="12" fill="#D4C281">    return model</text>
  
  <!-- Animated Elements -->
  <circle cx="200" cy="100" r="22" fill="none" stroke="#77A664" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="22;25;22" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="650" cy="140" r="14" fill="none" stroke="#77A664" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="14;16;14" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <!-- Title -->
  <text x="400" y="370" font-family="Arial" font-size="24" text-anchor="middle" fill="#FBFBFB">Machine Learning Algorithms Implementation</text>
