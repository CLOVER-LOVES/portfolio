  <line x1="150" y1="175" x2="120" y2="210" stroke="#D4C281" stroke-width="2"/>
  <line x1="150" y1="175" x2="180" y2="210" stroke="#D4C281" stroke-width="2"/>
  <line x1="250" y1="175" x2="220" y2="210" stroke="#D4C281" stroke-width="2"/>
