<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#1a1a1a"/>
  
  <!-- Main Container -->
  <rect x="50" y="50" width="700" height="300" rx="8" ry="8" fill="#2a2a2a" stroke="#77A664" stroke-width="2"/>
  
  <!-- Algorithm Visualization -->
  
  <!-- Decision Tree -->
  <circle cx="200" cy="100" r="20" fill="#77A664" opacity="0.9"/>
  <line x1="200" y1="120" x2="150" y2="160" stroke="#D4C281" stroke-width="2"/>
  <line x1="200" y1="120" x2="250" y2="160" stroke="#D4C281" stroke-width="2"/>
  <circle cx="150" cy="160" r="15" fill="#77A664" opacity="0.7"/>
