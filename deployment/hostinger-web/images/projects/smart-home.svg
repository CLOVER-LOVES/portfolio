<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#415A48"/>
  <rect x="50" y="50" width="700" height="300" fill="#333333" rx="10" ry="10"/>
  
  <!-- Smart Home Representation -->
  <polygon points="400,80 250,180 550,180" fill="#77A664"/>
  <rect x="280" y="180" width="240" height="150" fill="#A3AB9A"/>
  
  <!-- Windows -->
  <rect x="310" y="200" width="40" height="40" fill="#D4C281"/>
  <rect x="380" y="200" width="40" height="40" fill="#D4C281"/>
  <rect x="450" y="200" width="40" height="40" fill="#D4C281"/>
  
  <!-- Door -->
  <rect x="380" y="260" width="40" height="70" fill="#D4C281"/>
  
  <!-- IoT Connections -->
  <circle cx="200" cy="150" r="20" fill="#FBFBFB" opacity="0.7"/>
  <circle cx="600" cy="150" r="20" fill="#FBFBFB" opacity="0.7"/>
  <circle cx="200" cy="250" r="20" fill="#FBFBFB" opacity="0.7"/>
  <circle cx="600" cy="250" r="20" fill="#FBFBFB" opacity="0.7"/>
  
  <line x1="200" y1="150" x2="310" y2="200" stroke="#FBFBFB" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="600" y1="150" x2="490" y2="200" stroke="#FBFBFB" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="200" y1="250" x2="310" y2="240" stroke="#FBFBFB" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="600" y1="250" x2="490" y2="240" stroke="#FBFBFB" stroke-width="2" stroke-dasharray="5,5"/>
  
  <text x="400" y="350" font-family="Arial" font-size="24" text-anchor="middle" fill="#FBFBFB">Smart Home IoT System</text>
</svg>
