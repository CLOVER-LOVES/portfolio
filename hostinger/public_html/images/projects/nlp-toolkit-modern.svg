<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#77A664;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4C281;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Main background -->
  <rect width="800" height="400" fill="url(#bg-gradient)" />
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#77A664" stroke-width="1" opacity="0.2" />
  <circle cx="700" cy="300" r="100" fill="none" stroke="#D4C281" stroke-width="1" opacity="0.2" />
  <circle cx="400" cy="200" r="150" fill="none" stroke="#A3AB9A" stroke-width="1" opacity="0.1" />
  
  <!-- Main content area -->
  <rect x="100" y="50" width="600" height="300" rx="10" ry="10" fill="#2a2a2a" stroke="#333" stroke-width="2" />
  
  <!-- Text analysis visualization -->
  <rect x="130" y="80" width="540" height="60" rx="5" ry="5" fill="#333" />
  
  <!-- Text with sentiment highlighting -->
  <text x="150" y="110" font-family="Arial" font-size="14" fill="#FBFBFB">The new AI model performs</text>
  <text x="320" y="110" font-family="Arial" font-size="14" fill="#77A664" font-weight="bold">exceptionally well</text>
  <text x="450" y="110" font-family="Arial" font-size="14" fill="#FBFBFB">on complex NLP tasks.</text>
  
  <!-- Sentiment score -->
  <rect x="150" y="120" width="100" height="10" rx="5" ry="5" fill="#444" />
  <rect x="150" y="120" width="80" height="10" rx="5" ry="5" fill="#77A664" />
  <text x="260" y="130" font-family="Arial" font-size="12" fill="#A3AB9A">Sentiment: +0.8</text>
  
  <!-- Named Entity Recognition -->
  <rect x="130" y="160" width="540" height="60" rx="5" ry="5" fill="#333" />
  
  <text x="150" y="185" font-family="Arial" font-size="14" fill="#FBFBFB">Researchers at</text>
  <rect x="240" y="173" width="100" height="18" rx="3" ry="3" fill="#D4C281" opacity="0.3" />
  <text x="240" y="185" font-family="Arial" font-size="14" fill="#D4C281">OpenAI</text>
  <text x="290" y="185" font-family="Arial" font-size="14" fill="#FBFBFB">released</text>
  <rect x="350" y="173" width="120" height="18" rx="3" ry="3" fill="#77A664" opacity="0.3" />
  <text x="350" y="185" font-family="Arial" font-size="14" fill="#77A664">GPT-4</text>
  <text x="395" y="185" font-family="Arial" font-size="14" fill="#FBFBFB">in</text>
  <rect x="415" y="173" width="80" height="18" rx="3" ry="3" fill="#A3AB9A" opacity="0.3" />
  <text x="415" y="185" font-family="Arial" font-size="14" fill="#A3AB9A">March 2023</text>
  <text x="495" y="185" font-family="Arial" font-size="14" fill="#FBFBFB">.</text>
  
  <text x="150" y="205" font-family="Arial" font-size="12" fill="#FBFBFB">Entities: </text>
  <text x="200" y="205" font-family="Arial" font-size="12" fill="#D4C281">Organization</text>
  <text x="280" y="205" font-family="Arial" font-size="12" fill="#77A664">Product</text>
  <text x="340" y="205" font-family="Arial" font-size="12" fill="#A3AB9A">Date</text>
  
  <!-- Topic Modeling -->
  <rect x="130" y="240" width="260" height="90" rx="5" ry="5" fill="#333" />
  <text x="150" y="260" font-family="Arial" font-size="14" fill="#FBFBFB" font-weight="bold">Topic Modeling</text>
  
  <circle cx="180" cy="290" r="25" fill="#77A664" opacity="0.7" />
  <text x="180" y="295" font-family="Arial" font-size="12" text-anchor="middle" fill="#FBFBFB">AI</text>
  
  <circle cx="230" cy="280" r="20" fill="#D4C281" opacity="0.7" />
  <text x="230" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="#FBFBFB">ML</text>
  
  <circle cx="270" cy="300" r="15" fill="#A3AB9A" opacity="0.7" />
  <text x="270" y="305" font-family="Arial" font-size="10" text-anchor="middle" fill="#FBFBFB">NLP</text>
  
  <circle cx="210" cy="310" r="12" fill="#77A664" opacity="0.5" />
  <text x="210" y="315" font-family="Arial" font-size="8" text-anchor="middle" fill="#FBFBFB">Data</text>
  
  <!-- Text Summarization -->
  <rect x="410" y="240" width="260" height="90" rx="5" ry="5" fill="#333" />
  <text x="430" y="260" font-family="Arial" font-size="14" fill="#FBFBFB" font-weight="bold">Text Summarization</text>
  
  <rect x="430" y="270" width="220" height="5" rx="2.5" ry="2.5" fill="#444" />
  <rect x="430" y="280" width="220" height="5" rx="2.5" ry="2.5" fill="#444" />
  <rect x="430" y="290" width="220" height="5" rx="2.5" ry="2.5" fill="#444" />
  <rect x="430" y="300" width="220" height="5" rx="2.5" ry="2.5" fill="#444" />
  <rect x="430" y="310" width="150" height="5" rx="2.5" ry="2.5" fill="#444" />
  
  <rect x="430" y="270" width="180" height="5" rx="2.5" ry="2.5" fill="#D4C281" opacity="0.7" />
  <rect x="430" y="280" width="160" height="5" rx="2.5" ry="2.5" fill="#D4C281" opacity="0.7" />
  <rect x="430" y="290" width="200" height="5" rx="2.5" ry="2.5" fill="#D4C281" opacity="0.7" />
  <rect x="430" y="300" width="140" height="5" rx="2.5" ry="2.5" fill="#D4C281" opacity="0.7" />
  <rect x="430" y="310" width="100" height="5" rx="2.5" ry="2.5" fill="#D4C281" opacity="0.7" />
  
  <!-- Animated elements -->
  <g filter="url(#glow)">
    <circle cx="400" cy="50" r="3" fill="#77A664" opacity="0.7">
      <animate attributeName="cy" values="50;60;50" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="420" cy="50" r="3" fill="#D4C281" opacity="0.7">
      <animate attributeName="cy" values="50;55;50" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="380" cy="50" r="3" fill="#A3AB9A" opacity="0.7">
      <animate attributeName="cy" values="50;58;50" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Title -->
  <text x="400" y="380" font-family="Arial" font-size="24" text-anchor="middle" fill="#FBFBFB">Natural Language Processing Toolkit</text>
</svg>
