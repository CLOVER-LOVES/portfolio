<?xml version="1.0" encoding="UTF-8"?>
<svg width="800px" height="800px" viewBox="0 0 800 800" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Pulse Animation -->
        <radialGradient id="pulseGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" stop-color="#9C27B0" stop-opacity="0.3">
                <animate attributeName="stop-opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite" />
            </stop>
            <stop offset="100%" stop-color="#00BCD4" stop-opacity="0">
                <animate attributeName="stop-opacity" values="0;0.05;0" dur="3s" repeatCount="indefinite" />
            </stop>
        </radialGradient>
        
        <!-- Data Flow Animation -->
        <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#9C27B0" stop-opacity="0.2">
                <animate attributeName="offset" values="0;1" dur="3s" repeatCount="indefinite" />
            </stop>
            <stop offset="100%" stop-color="#00BCD4" stop-opacity="0.2">
                <animate attributeName="offset" values="0;1" dur="3s" repeatCount="indefinite" />
            </stop>
        </linearGradient>
    </defs>
    
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd" opacity="0.15">
        <!-- Pulsing Circles -->
        <circle cx="400" cy="400" r="300" fill="url(#pulseGradient)">
            <animate attributeName="r" values="300;320;300" dur="4s" repeatCount="indefinite" />
        </circle>
        
        <circle cx="400" cy="400" r="200" fill="url(#pulseGradient)">
            <animate attributeName="r" values="200;220;200" dur="4s" repeatCount="indefinite" />
        </circle>
        
        <circle cx="400" cy="400" r="100" fill="url(#pulseGradient)">
            <animate attributeName="r" values="100;120;100" dur="4s" repeatCount="indefinite" />
        </circle>
        
        <!-- Data Flow Lines -->
        <path d="M100,400 L700,400" stroke="url(#flowGradient)" stroke-width="2" />
        <path d="M400,100 L400,700" stroke="url(#flowGradient)" stroke-width="2" />
        <path d="M200,200 L600,600" stroke="url(#flowGradient)" stroke-width="2" />
        <path d="M200,600 L600,200" stroke="url(#flowGradient)" stroke-width="2" />
    </g>
</svg>
