<?xml version="1.0" encoding="UTF-8"?>
<svg width="800px" height="800px" viewBox="0 0 800 800" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd" opacity="0.15">
        <!-- Code Brackets -->
        <path d="M100,200 L150,250 L100,300 L150,350 L100,400" stroke="#77A664" stroke-width="2" opacity="0.6"></path>
        <path d="M700,200 L650,250 L700,300 L650,350 L700,400" stroke="#77A664" stroke-width="2" opacity="0.6"></path>
        
        <!-- Code Lines -->
        <path d="M200,250 L600,250" stroke="#77A664" stroke-width="1.5" opacity="0.4"></path>
        <path d="M200,300 L500,300" stroke="#77A664" stroke-width="1.5" opacity="0.4"></path>
        <path d="M200,350 L550,350" stroke="#77A664" stroke-width="1.5" opacity="0.4"></path>
        
        <!-- Function Brackets -->
        <path d="M200,450 L250,450 L250,550 L200,550" stroke="#D4C281" stroke-width="2" opacity="0.6"></path>
        <path d="M600,450 L550,450 L550,550 L600,550" stroke="#D4C281" stroke-width="2" opacity="0.6"></path>
        
