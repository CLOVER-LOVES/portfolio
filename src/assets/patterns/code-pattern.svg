        <path d="M300,520 L450,520" stroke="#D4C281" stroke-width="1.5" opacity="0.4"></path>
        
        <!-- Dots representing variables -->
        <circle fill="#77A664" cx="220" cy="250" r="3"></circle>
        <circle fill="#77A664" cx="220" cy="300" r="3"></circle>
        <circle fill="#77A664" cx="220" cy="350" r="3"></circle>
        
        <circle fill="#D4C281" cx="320" cy="480" r="3"></circle>
